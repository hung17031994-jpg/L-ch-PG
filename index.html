<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes I Do - Dịch vụ Bấm Call Thay</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h3 { text-align: center; color: #333; }
        .btn { display: block; width: 100%; padding: 10px; margin: 15px 0; background-color: #4285F4; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background-color: #357ae8; }
        .btn-momo { background-color: #a50064; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .info-box { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Yes I Do</h1>
    
    <div class="info-box">
        <h3>1. Nạp Tiền Giao Dịch</h3>
        <p><strong>Số MoMo:</strong> 0123456789</p>
        <p><strong>Nội dung:</strong> YESIDO + ID Hệ thống của bạn</p>
        <button class="btn btn-momo">Tôi đã chuyển tiền</button>
    </div>

    <div class="info-box">
        <h3>2. Gửi Thông Tin Cho Hệ Thống</h3>
        
        <!-- Form gửi qua Forminit -->
        <form action="https://forminit.com/f/ysw4soq3x1h" method="POST" enctype="multipart/form-data" id="yesidoForm">
            
            <div class="input-group">
                <label>Nhập ID hệ thống của bạn:</label>
                <input type="text" name="ID_Khach_Hang" id="customerId" placeholder="Nhập ID để nhận diện..." required>
            </div>
            
            <div class="input-group">
                <label>Số điểm (số lượng call nhờ bấm):</label>
                <input type="number" name="So_Diem" id="callPoints" min="1" value="1" oninput="calculatePrice()" required>
            </div>
            
            <p style="color: red; font-weight: bold;">Tổng tiền thanh toán: <span id="totalPriceDisplay">2,000</span> VNĐ</p>
            <input type="hidden" name="Tong_Tien" id="hiddenTotalPrice" value="2000 VNĐ">
            
            <div class="input-group">
                <label>Tải ảnh Check-in (số ảnh = số điểm):</label>
                <input type="file" name="Anh_Checkin[]" id="checkinPhotos" multiple accept="image/*" required>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">Gửi Yêu Cầu Tới Admin</button>
        </form>
    </div>
</div>

<script>
    function calculatePrice() {
        const points = parseInt(document.getElementById('callPoints').value) || 0;
        let total = points >= 5 ? points * 1000 : points * 2000;
        
        document.getElementById('totalPriceDisplay').innerText = total.toLocaleString('vi-VN');
        document.getElementById('hiddenTotalPrice').value = total.toLocaleString('vi-VN') + " VNĐ";
    }

    document.getElementById('yesidoForm').addEventListener('submit', function(e) {
        const points = parseInt(document.getElementById('callPoints').value);
        const photos = document.getElementById('checkinPhotos').files;

        // Kiểm tra số lượng ảnh và số điểm
        if (photos.length !== points) {
            e.preventDefault(); 
            alert("Lỗi: Bạn đã tải lên " + photos.length + " ảnh, nhưng nhập " + points + " điểm. Vui lòng chọn lại số lượng ảnh cho khớp!");
        } else {
            document.getElementById('submitBtn').innerText = "Đang tải ảnh và gửi đi...";
            document.getElementById('submitBtn').style.backgroundColor = "#ccc";
        }
    });
</script>

</body>
</html>
